<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live API Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .profile-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
            width: 100%;
        }
        .profile-card h2 {
            margin: 10px 0 5px 0;
            color: #333;
        }
        .profile-card p {
            color: #666;
            margin: 5px 0;
        }
        .company-tag {
            display: inline-block;
            background-color: #007bff;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-top: 15px;
        }
        .load-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 20px;
            transition: background 0.2s;
        }
        .load-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <h2 id="user-name">Fetching Live Profile...</h2>
        <p id="user-email"></p>
        <p id="user-phone"></p>
        <span class="company-tag" id="user-company">Connecting...</span>
        <br>
        <button class="load-btn" onclick="fetchLiveUser()">Fetch Next Random Profile</button>
    </div>

    <script>
        let userId = 1;

        async function fetchLiveUser() {
            try {
                const response = await fetch(`https://jsonplaceholder.typicode.com/users/${userId}`);
                const user = await response.json();

                document.getElementById('user-name').innerText = user.name;
                document.getElementById('user-email').innerText = user.email;
                document.getElementById('user-phone').innerText = `Phone: ${user.phone}`;
                document.getElementById('user-company').innerText = `Company: ${user.company.name}`;

                userId = userId < 10 ? userId + 1 : 1;

            } catch (error) {
                console.error("Failed to load data from web API:", error);
                document.getElementById('user-name').innerText = "Failed to load data.";
            }
        }

        fetchLiveUser();
    </script>

</body>
</html>
