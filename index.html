<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Custom API Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .profile-card {
            background: #1e293b;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 380px;
            width: 100%;
            border: 1px solid #334155;
            color: #f8fafc;
        }
        .profile-card h2 {
            margin: 0 0 10px 0;
            color: #38bdf8;
            font-size: 1.6rem;
        }
        .profile-card p {
            color: #94a3b8;
            margin: 8px 0;
            font-size: 1rem;
        }
        .status-tag {
            display: inline-block;
            background-color: #10b981;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <h2 id="dev-role">Connecting to Local API...</h2>
        <p id="dev-node">Location: ---</p>
        <p id="dev-progress">Lessons Finished: ---</p>
        <span class="status-tag" id="dev-status">System: Loading</span>
    </div>

    <script>
        async function fetchMyEngineData() {
            try {
                // Fetch data directly from your local python server engine!
                const response = await fetch('http://127.0.0.1:5000/');
                const data = await response.json();

                // Inject our custom dictionary properties into the UI
                document.getElementById('dev-role').innerText = data.developer_role;
                document.getElementById('dev-node').innerText = `Location Node: ${data.location_node}`;
                document.getElementById('dev-progress').innerText = `Lessons Completed: ${data.completed_lessons.join(', ')}`;
                document.getElementById('dev-status').innerText = `Server Status: ${data.site_status}`;

            } catch (error) {
                console.error("Could not fetch data from your local Python server:", error);
                document.getElementById('dev-role').innerText = "Server Link Offline";
                document.getElementById('dev-status').style.backgroundColor = "#ef4444";
                document.getElementById('dev-status').innerText = "Offline";
            }
        }

        // Trigger loopback data request immediately on load
        fetchMyEngineData();
    </script>

</body>
</html>
